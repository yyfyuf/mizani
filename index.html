<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ميزاني: أدخل راتبك والتزاماتك واعرف كم تصرف يوميًا وأسبوعيًا.">
<title>ميزاني — ميزانيتك.. لحياة أفضل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--surface:#fff;--ink:#0D2B3E;--mute:#58697A;--line:#D3DDD9;--green:#0E7C5A;--amber:#F0B23E;--coral:#D9533A;--onacc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1620;--surface:#13242F;--ink:#EAF1F0;--mute:#9DB0BC;--line:#28404F;--green:#3CC796;--coral:#F07B63;--onacc:#08201A}}
:root[data-theme="dark"]{--bg:#0A1620;--surface:#13242F;--ink:#EAF1F0;--mute:#9DB0BC;--line:#28404F;--green:#3CC796;--coral:#F07B63;--onacc:#08201A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
h1,h2,h3,.fx{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font:700 24px "Readex Pro",Tahoma,sans-serif;color:var(--green)}
.hd{display:flex;gap:10px;align-items:center}
.btn,.ic,.sm{font:600 15px "IBM Plex Sans Arabic",Tahoma,sans-serif;border-radius:10px;cursor:pointer;border:0}
.btn{background:var(--green);color:var(--onacc);padding:12px 22px;font-size:17px}
.ic{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:40px;height:40px}
.sm{background:none;border:1px dashed var(--line);color:var(--green);padding:7px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.tag{background:var(--amber);color:#0D2B3E;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
h1{font-size:clamp(28px,5.5vw,50px);line-height:1.35;margin:14px 0 12px;max-width:15em}
.lead{color:var(--mute);font-size:18px;margin:0;max-width:34em}
.app{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;margin:24px 0;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--mute);font:600 14px "IBM Plex Sans Arabic",Tahoma,sans-serif;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
h3{font-size:16px;margin:20px 0 10px}
h3:first-child{margin-top:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{width:100px;direction:ltr;text-align:left}
.sal{display:flex;gap:10px;align-items:center}
.sal input{flex:1;width:auto;font-size:22px;font-weight:600}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.row .nm{flex:1;min-width:100px}
.x{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plans button,.pk button{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font:600 15px "IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);cursor:pointer;line-height:1.5}
.plans small,.pk small{display:block;color:var(--mute);font-size:12px;font-weight:400}
[aria-checked=true],[aria-pressed=true]{border-color:var(--green)!important;background:var(--surface)!important;box-shadow:inset 0 0 0 1px var(--green)}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pk .fx{font-size:24px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:500 15px "IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);cursor:pointer}
.muted{color:var(--mute);font-size:14px}
.res{position:sticky;top:12px;background:#0D2B3E;color:#EEF3F1;border-radius:24px;border:0;padding:24px}
.ringbox{position:relative;width:min(230px,70%);margin:0 auto 12px}
.ringbox svg{display:block;width:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:9;stroke-linecap:round}
.tr{stroke:rgba(255,255,255,.14)}
#pr{stroke:#F0B23E;transition:stroke-dashoffset .5s,stroke .3s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid .fx{font-size:clamp(44px,11vw,62px);font-weight:700;line-height:1;color:#F0B23E}
.mid small{opacity:.8;font-size:14px;margin-top:6px}
.wk{text-align:center;font-size:17px;margin-bottom:16px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.14);gap:2px}
.bar i{display:block;height:100%;transition:width .35s}
.lg{list-style:none;margin:14px 0;padding:0;display:grid;gap:6px;font-size:15px}
.lg li{display:flex;justify-content:space-between}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px}
.note{border-top:1px solid rgba(255,255,255,.2);padding-top:14px;font-size:15px;min-height:3.4em}
.warn{color:#FFB4A5}
.al{border-radius:10px;padding:8px 12px;margin-top:8px;background:rgba(255,255,255,.1);border-inline-start:5px solid #3CC796;font-size:14px}
.al.w{border-color:#F0B23E}.al.d{border-color:#F07B63}
.ex{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--bg);border-radius:12px;padding:10px}
.stats .fx{font-size:20px;font-weight:700;display:block;line-height:1.4}
.cb{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;margin-bottom:8px;font-size:15px}
.cb i{display:block;height:12px;border-radius:6px;background:var(--green)}
.cb span:last-child{text-align:end}
.mt{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.mt i{display:block;height:100%;background:var(--green);transition:width .4s}
.g{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:start}
.yr{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:10px}
.yr div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute)}
.yr i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
label.tg{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ft{margin:0 0 16px;padding-inline-start:20px}
footer{padding:20px 0;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media (max-width:780px){.app{grid-template-columns:1fr}.res{position:static;order:-1}.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">ميزاني</div><div class="hd"><span class="tag" id="pt" hidden></span><button class="ic" id="theme" aria-label="تغيير المظهر">◐</button></div></header>
<h1>اعرف كم تقدر تصرف اليوم، بدون ما تخرب ميزانيتك</h1>
<p class="lead">أدخل راتبك والتزاماتك، وسجّل مصروفك خلال اليوم، وشوف المتبقي يتحدّث قدامك.</p>

<section class="app">
<div class="panel"><div class="tabs" role="tablist" id="tabs"></div><div id="pn"></div></div>
<div class="panel res" aria-live="polite">
<div class="ringbox"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="52"/><circle id="pr" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
<div class="mid"><div class="fx" id="rem">0</div><small id="remlbl"></small></div></div>
<div class="wk" id="wk"></div><div class="bar" id="bar"></div><ul class="lg" id="lg"></ul><div class="note" id="note"></div><div id="alerts"></div>
</div>
</section>
<footer>ميزاني — ميزانيتك.. لحياة أفضل</footer>
</div>

<script>
var KEY="mizani3",CATS=[["🍔","مطاعم"],["⛽","بنزين"],["☕","قهوة"],["🛒","مشتريات"],["🎬","ترفيه"],["📦","أخرى"]],
MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],
PL=[["محافظة","مصروف أعلى",.6],["متوازنة","توازن",1],["ادخار سريع","ادخار أعلى",1.5]],
TABS=[["plan","الخطة"],["today","اليوم"],["goal","أهدافي"],["an","التحليل",1],["al","التنبيهات",1],["pl","الخطط",1],["rp","التقارير",1]];
var S={salary:7000,obl:[["إيجار",1500],["سيارة",1200],["جوال",150],["اشتراكات",100]],alloc:[["ادخار",1000],["طوارئ",500],["سفر",300]],plan:1,ex:[],tg:[["سيارة جديدة",10000,2500,750]],dues:[["إيجار",1]],al:{on:1,pct:80},sub:null,pick:"yearly",tab:"plan",theme:""};
try{var d0=JSON.parse(localStorage.getItem(KEY)||"null");if(d0)for(var k in d0)S[k]=d0[k]}catch(e){}
var $=function(i){return document.getElementById(i)};
var fmt=function(n){return Math.round(n).toLocaleString("en-US")};
var esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")};
var sum=function(a,i){return a.reduce(function(t,r){return t+(+r[i]||0)},0)};
var A=function(a){return a.reduce(function(t,e){return t+e.a},0)};
var ymd=function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var NOW=new Date(),TD=ymd(NOW),MK=TD.slice(0,7),RM=MK,B;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function theme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme)}
function left(){return S.sub?7-Math.floor((Date.now()-S.sub.start)/864e5):0}
function isPro(){return left()>0}
function mex(k){return S.ex.filter(function(e){return e.d.slice(0,7)===k})}
function byCat(a){var o={};a.forEach(function(e){o[e.c]=(o[e.c]||0)+e.a});return Object.keys(o).map(function(c){return[c,o[c]]}).sort(function(a,b){return b[1]-a[1]})}
function icon(c){for(var i=0;i<CATS.length;i++)if(CATS[i][1]===c)return CATS[i][0];return"📦"}
function base(){var sal=+S.salary||0,O=sum(S.obl,1),G=Math.round(sum(S.alloc,1)*PL[S.plan][2]),V=sal-O-G,v=Math.max(0,V);return{sal:sal,O:O,G:G,V:V,v:v,daily:Math.floor(v/30)}}
function rows(k){return S[k].map(function(r,i){return'<div class="row"><input class="nm" data-k="'+k+'" data-i="'+i+'" value="'+esc(r[0])+'" aria-label="الاسم"><input type="number" inputmode="numeric" min="0" data-k="'+k+'" data-i="'+i+'" value="'+r[1]+'" aria-label="المبلغ"><button class="x" data-del="'+k+'" data-i="'+i+'" aria-label="حذف">×</button></div>'}).join("")}
function bars(c){return c.map(function(x){return'<div class="cb"><span>'+icon(x[0])+" "+x[0]+'</span><span><i style="width:'+(x[1]/c[0][1]*100)+'%"></i></span><span>'+fmt(x[1])+'</span></div>'}).join("")}

function tabs(){$("tabs").innerHTML=TABS.map(function(t){var lk=t[2]&&!isPro();return'<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+(lk?"🔒 ":"")+t[1]+'</button>'}).join("");
  var pt=$("pt");pt.hidden=!isPro();pt.textContent="Pro · باقي "+left()+" أيام"}
function panel(){B=base();var t=S.tab;if(!isPro()&&TABS.some(function(x){return x[0]===t&&x[2]}))t="pw";
  $("pn").innerHTML={plan:pPlan,today:pToday,goal:pGoal,an:pAn,al:pAl,pl:pPl,rp:pRp,pw:pPw}[t]();if(t==="goal")upGo()}
function pPlan(){return'<h3>راتبك الشهري</h3><label class="sal"><input id="salary" type="number" inputmode="numeric" min="0" value="'+S.salary+'" aria-label="الراتب"><span>ريال</span></label>'+
  '<h3>التزاماتك الثابتة</h3>'+rows("obl")+'<button class="sm" data-add="obl">+ أضف التزام</button><h3>أهدافك الشهرية</h3>'+rows("alloc")+'<button class="sm" data-add="alloc">+ أضف هدف</button>'+
  '<h3>اختر خطتك</h3><div class="plans" role="radiogroup">'+PL.map(function(p,i){return'<button role="radio" aria-checked="'+(S.plan===i)+'" data-plan="'+i+'">'+p[0]+'<small>'+p[1]+'</small></button>'}).join("")+'</div>'}
function pToday(){var l=S.ex.filter(function(e){return e.d===TD});
  return'<h3>إضافة سريعة</h3><div class="chips"><button data-q="مطاعم|35">🍔 مطاعم 35</button><button data-q="بنزين|80">⛽ بنزين 80</button><button data-q="قهوة|15">☕ قهوة 15</button><button data-q="مشتريات|50">🛒 مشتريات 50</button></div>'+
  '<div class="row"><select id="ec" aria-label="الفئة">'+CATS.map(function(c){return'<option>'+c[1]+'</option>'}).join("")+'</select><input class="nm" id="en" placeholder="وش صرفت؟" aria-label="الوصف"><input id="ea" type="number" inputmode="numeric" min="0" placeholder="المبلغ" aria-label="المبلغ"><button class="sm" id="eadd">أضف</button></div>'+
  '<h3>مصروفات اليوم</h3>'+(l.length?l.map(function(e){return'<div class="ex"><span>'+icon(e.c)+" "+esc(e.n||e.c)+'</span><span>'+fmt(e.a)+' ريال <button class="x" data-xd="'+S.ex.indexOf(e)+'" aria-label="حذف">×</button></span></div>'}).join(""):'<div class="muted">ما سجلت شي اليوم.</div>')}
function pGoal(){return S.tg.map(function(g,i){return'<div class="g"><div class="row"><input class="nm" data-g="'+i+'" data-f="0" value="'+esc(g[0])+'" aria-label="اسم الهدف">'+(i?'<button class="x" data-xg="'+i+'" aria-label="حذف">×</button>':"")+'</div>'+
  '<div class="row"><label class="muted">المطلوب <input type="number" data-g="'+i+'" data-f="1" value="'+g[1]+'"></label><label class="muted">جمعت <input type="number" data-g="'+i+'" data-f="2" value="'+g[2]+'"></label><label class="muted">شهريًا <input type="number" data-g="'+i+'" data-f="3" value="'+g[3]+'"></label></div>'+
  '<div class="mt"><i id="gb'+i+'"></i></div><div class="muted" id="gt'+i+'"></div></div>'}).join("")+'<button class="sm" id="gadd">'+(isPro()?"+ أضف هدف":"🔒 أهداف متعددة (Pro)")+'</button>'}
function upGo(){S.tg.forEach(function(g,i){var l=Math.max(0,g[1]-g[2]),n=g[3]>0?Math.ceil(l/g[3]):0;$("gb"+i).style.width=(g[1]>0?Math.min(100,g[2]/g[1]*100):0)+"%";
  $("gt"+i).textContent=l===0?"وصلت للهدف 🎉":g[3]>0?"باقي "+fmt(l)+" ريال، تخلص خلال "+n+" أشهر":"حدّد الادخار الشهري"});save()}
function pAn(){var ex=mex(MK),tot=A(ex),dim=new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate(),proj=tot/NOW.getDate()*dim,c=byCat(ex);
  return'<div class="stats"><div><span class="fx">'+fmt(tot)+'</span><span class="muted">صرفت هذا الشهر</span></div><div><span class="fx">'+fmt(proj)+'</span><span class="muted">المتوقع نهاية الشهر</span></div><div><span class="fx" style="color:'+(proj>B.v?"var(--coral)":"var(--green)")+'">'+fmt(B.v-proj)+'</span><span class="muted">الفرق عن ميزانيتك ('+fmt(B.v)+')</span></div></div>'+
  '<h3>مصروفك حسب الفئة</h3>'+(c.length?bars(c):'<p class="muted">سجّل مصروفك من تبويب اليوم عشان يظهر التحليل.</p>')}
function pAl(){return'<h3>إعدادات التنبيهات</h3><label class="tg"><input type="checkbox" id="alon"'+(S.al.on?" checked":"")+'> فعّل التنبيهات</label><label class="tg">نبّهني عند وصولي <input type="number" id="alpct" min="10" max="100" value="'+S.al.pct+'"> % من ميزانية اليوم والشهر</label>'+
  '<h3>تواريخ الاستحقاق</h3><p class="muted">تنبّهك قبل 3 أيام من أي استحقاق.</p>'+S.dues.map(function(d,i){return'<div class="row"><input class="nm" data-d="'+i+'" data-f="0" value="'+esc(d[0])+'" placeholder="الالتزام" aria-label="الالتزام"><label class="muted">يوم <input type="number" min="1" max="28" data-d="'+i+'" data-f="1" value="'+d[1]+'"></label><button class="x" data-xdue="'+i+'" aria-label="حذف">×</button></div>'}).join("")+'<button class="sm" id="dadd">+ أضف التزام</button>'}
function pPl(){var sg=sum(S.alloc,1),cols=PL.map(function(p){var G=Math.round(sg*p[2]),V=Math.max(0,B.sal-B.O-G);return{G:G,V:V,d:Math.floor(V/30),w:Math.floor(V/4)}});
  return'<h3>قارن الخطط على راتبك ('+fmt(B.sal)+' ريال)</h3><table><tr><th></th>'+PL.map(function(p){return'<th>'+p[0]+'</th>'}).join("")+'</tr>'+
  [["ادخار شهري","G"],["مصروف متغير","V"],["يوميًا","d"],["أسبوعيًا","w"]].map(function(r){return'<tr><td>'+r[0]+'</td>'+cols.map(function(c){return'<td>'+fmt(c[r[1]])+'</td>'}).join("")+'</tr>'}).join("")+'</table>'}
function pRp(){var ex=mex(RM),tot=A(ex),y=+RM.slice(0,4),m=+RM.slice(5),pk=m===1?(y-1)+"-12":y+"-"+String(m-1).padStart(2,"0"),df=tot-A(mex(pk)),c=byCat(ex),yr=[],mx=1,i;
  for(i=1;i<=12;i++){var t=A(mex(y+"-"+String(i).padStart(2,"0")));yr.push(t);if(t>mx)mx=t}
  return'<div class="row"><h3 style="margin:0;flex:1">تقرير شهري</h3><input type="month" id="rm" value="'+RM+'" aria-label="الشهر"></div><div class="stats" style="margin-top:12px"><div><span class="fx">'+fmt(tot)+'</span><span class="muted">إجمالي '+MON[m-1]+'</span></div><div><span class="fx" style="color:'+(df>0?"var(--coral)":"var(--green)")+'">'+(df>0?"+":"")+fmt(df)+'</span><span class="muted">عن الشهر السابق</span></div><div><span class="fx">'+(c.length?icon(c[0][0])+" "+c[0][0]:"-")+'</span><span class="muted">أعلى فئة</span></div></div>'+(c.length?bars(c):"")+
  '<h3>تقرير سنة '+y+'</h3><div class="yr">'+yr.map(function(t,j){return'<div><i style="height:'+(t/mx*85)+'%" title="'+MON[j]+'"></i>'+(j+1)+'</div>'}).join("")+'</div><p class="muted">إجمالي السنة: '+fmt(yr.reduce(function(a,b){return a+b},0))+' ريال</p>'+
  '<h3>نسخة احتياطية</h3><div class="row"><button class="sm" id="exp">تنزيل بياناتي</button><label class="sm" style="cursor:pointer">استعادة من ملف<input type="file" id="imp" accept=".json" hidden></label></div>'}
function pPw(){var y=S.pick==="yearly",ex=S.sub&&left()<=0;
  return(ex?'<p class="warn" style="color:var(--coral)">انتهت تجربتك المجانية. اشترك عشان تكمل.</p>':"")+'<h3>ميزاني Pro</h3><ul class="ft"><li>تحليل المصروفات حسب الفئة</li><li>أهداف ادخار متعددة</li><li>تنبيهات ذكية</li><li>مقارنة الخطط</li><li>تقارير شهرية وسنوية ونسخ احتياطي</li></ul>'+
  '<div class="pk"><button data-pick="monthly" aria-pressed="'+!y+'"><span class="fx">9.99 ريال</span><small>شهريًا</small></button><button data-pick="yearly" aria-pressed="'+y+'"><span class="fx">79 ريال</span><small>سنويًا، أوفر من الشهري</small></button></div>'+
  '<button class="btn" id="trial">ابدأ 7 أيام مجانًا</button><p class="muted">بعد التجربة: '+(y?"79 ريال في السنة":"9.99 ريال في الشهر")+'. المجاني يشمل: الخطة، مصروف اليوم، وهدف واحد. الدفع الفعلي يحتاج ربطًا بخدمة دفع.</p>'}

function alerts(){var a=[];if(isPro()&&S.al.on){var p=S.al.pct/100,tm=A(mex(MK)),td=A(S.ex.filter(function(e){return e.d===TD})),T=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  if(B.daily>0&&td>=B.daily)a.push(["d","تجاوزت ميزانية اليوم: "+fmt(td)+" من "+fmt(B.daily)+" ريال."]);else if(B.daily>0&&td>=B.daily*p)a.push(["w","وصلت "+S.al.pct+"% من ميزانية اليوم."]);
  if(B.v>0&&tm>=B.v*p)a.push([tm>=B.v?"d":"w","مصروف الشهر "+fmt(tm)+" من "+fmt(B.v)+" ريال."]);
  S.dues.forEach(function(d){var dy=+d[1]||1,dt=new Date(T.getFullYear(),T.getMonth(),dy);if(dt<T)dt=new Date(T.getFullYear(),T.getMonth()+1,dy);var n=Math.round((dt-T)/864e5);if(n<=3)a.push(["w",(d[0]||"التزام")+(n?" يستحق بعد "+n+" أيام.":" يستحق اليوم.")])})}
  $("alerts").innerHTML=a.map(function(x){return'<div class="al '+x[0]+'">'+x[1]+'</div>'}).join("")}
function calc(){B=base();var spent=A(S.ex.filter(function(e){return e.d===TD})),rem=B.daily-spent;
  $("rem").textContent=fmt(Math.abs(rem));$("remlbl").textContent=rem<0?"تجاوزت اليوم (ريال)":"متبقي اليوم من "+fmt(B.daily);
  var p=B.daily>0?Math.max(0,Math.min(1,rem/B.daily)):0,pr=$("pr");pr.style.strokeDashoffset=326.7*(1-p);pr.style.stroke=rem<0?"#F07B63":"#F0B23E";
  $("wk").textContent=fmt(Math.floor(B.v/4))+" ريال أسبوعيًا";
  var bs=Math.max(B.sal,B.O+B.G,1),sg=[["التزامات",B.O,"#F07B63"],["أهداف وادخار",B.G,"#3CC796"],["مصروف متغير",B.v,"#F0B23E"]];
  $("bar").innerHTML=sg.map(function(s){return'<i style="width:'+(s[1]/bs*100)+'%;background:'+s[2]+'"></i>'}).join("");
  $("lg").innerHTML=sg.map(function(s){return'<li><span><span class="dot" style="background:'+s[2]+'"></span>'+s[0]+'</span><b>'+fmt(s[1])+'</b></li>'}).join("");
  $("note").innerHTML=B.V>=0?"بعد الالتزامات عندك "+fmt(B.sal-B.O)+" ريال. في خطة "+PL[S.plan][0]+" تدخّر "+fmt(B.G)+" ويبقى "+fmt(B.V)+" للمصروف.":'<span class="warn">التزاماتك وأهدافك أكبر من الراتب بـ '+fmt(-B.V)+' ريال. خفّف التزامًا أو جرّب خطة محافظة.</span>';
  alerts();save()}
function addEx(c,n,a){a=+a||0;if(!a)return;S.ex.push({d:TD,c:c,n:n,a:a});panel();calc()}
function go(){tabs();panel();calc()}

document.addEventListener("input",function(e){var t=e.target,D=t.dataset,id=t.id;
  if(id==="salary")S.salary=+t.value||0;
  else if(D.k){var r=S[D.k][+D.i];if(t.classList.contains("nm"))r[0]=t.value;else r[1]=+t.value||0}
  else if(D.g!==undefined){S.tg[+D.g][+D.f]=D.f==="0"?t.value:(+t.value||0);return upGo()}
  else if(D.d!==undefined){S.dues[+D.d][+D.f]=D.f==="0"?t.value:(+t.value||1)}
  else if(id==="alon")S.al.on=t.checked?1:0;
  else if(id==="alpct")S.al.pct=Math.min(100,Math.max(10,+t.value||80));
  else if(id==="rm"){if(t.value){RM=t.value;panel()}return}
  else return;
  calc()});
document.addEventListener("change",function(e){if(e.target.id!=="imp")return;var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);for(var k in d)S[k]=d[k];save();go()}catch(x){alert("الملف غير صالح")}};r.readAsText(f)});
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;var D=t.dataset,id=t.id;
  if(D.tab){S.tab=D.tab;tabs();panel();save()}
  else if(D.add){S[D.add].push(["",0]);panel();calc();var q=document.querySelectorAll('[data-k="'+D.add+'"].nm');q[q.length-1].focus()}
  else if(D.del){S[D.del].splice(+D.i,1);panel();calc()}
  else if(D.plan){S.plan=+D.plan;panel();calc()}
  else if(D.q){var s=D.q.split("|");addEx(s[0],"",s[1])}
  else if(D.xd){S.ex.splice(+D.xd,1);panel();calc()}
  else if(id==="eadd"){addEx($("ec").value,$("en").value,$("ea").value)}
  else if(id==="gadd"){if(isPro()){S.tg.push(["هدف جديد",1000,0,200]);panel()}else{S.tab="an";tabs();panel()}}
  else if(D.xg){S.tg.splice(+D.xg,1);panel()}
  else if(id==="dadd"){S.dues.push(["",1]);panel()}
  else if(D.xdue){S.dues.splice(+D.xdue,1);panel();calc()}
  else if(D.pick){S.pick=D.pick;save();panel()}
  else if(id==="trial"){S.sub={start:Date.now()};S.tab="an";save();go()}
  else if(id==="exp"){var u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="mizani-backup.json";a.click()}
  else if(id==="theme"){var dk=document.documentElement.getAttribute("data-theme")==="dark"||(!S.theme&&matchMedia("(prefers-color-scheme:dark)").matches);S.theme=dk?"light":"dark";theme();save()}});
theme();go();
</script>
